 <!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Animated Gradient */
            background: linear-gradient(-45deg, #00c6ff, #0072ff, #ff512f, #dd2476);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .result-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-bottom: 10px;
        }

        .status {
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc; /* default color */
        }

        video {
            width: 100%;
            border-radius: 15px;
            margin-top: 15px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            padding: 10px 20px;
            border-radius: 30px;
            transition: 0.3s;
        }

        a:hover {
            background: linear-gradient(to right, #ff512f, #dd2476);
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="result-box">
        <h2>🚗 Prediction Result</h2>

        <!-- No condition -->
        <h3 class="status">Status: {{ prediction }}</h3>
        <h4>Probability: {{ probability }}</h4>

        <!-- Single video -->
       

        <a href="/">🔄 Predict Again</a>
    </div>

</body>
</html>
